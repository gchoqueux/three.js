<!DOCTYPE html>
<html lang="en">
	<head>
		<title>three.js webgl - postprocessing - interactive displacement map</title>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, user-scalable=no, minimum-scale=1.0, maximum-scale=1.0">
		<link type="text/css" rel="stylesheet" href="main.css">
	</head>

	<body>

		<div id="info">
			<a href="https://threejs.org" target="_blank" rel="noopener">three.js</a> - interactive displacement map demo.<br />
		</div>

		<script type="importmap">
			{
				"imports": {
					"three": "../build/three.module.js",
					"three/addons/": "./jsm/"
				}
			}
		</script>

		<script type="module">

			import * as THREE from 'three';

			import Stats from 'three/addons/libs/stats.module.js';

			import { GUI } from 'three/addons/libs/lil-gui.module.min.js';
			import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
			import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
			import { DepthSavePass } from 'three/addons/postprocessing/DepthSavePass.js';

			import { TexturePass } from 'three/addons/postprocessing/TexturePass.js';

			import { Depth2NormalPass } from 'three/addons/postprocessing/Depth2NormalPass.js';

			import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
			import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';
			import { pickWorldPosition } from 'three/addons/utils/DepthTextureUtils.js';



			let stats, container;
			let camera, scene, renderer, controls, sphere, material;
			let composer, renderPass, depthSavePass, outPass, renderTarget, texturePass, depth2NormalPass;

			const logarithmicDepthBuffer = [ 'linear', 'logarithmic' ];

			const mesures = [];

			const settings = {
				animate: false,
				depthBuffer: logarithmicDepthBuffer[ 0 ],
				rayCaster: false,
				timePicking: 'ms',
				showDepthTexture: false
			};

			const mouseR = new THREE.Vector2();

			const onMouseMouve = ( e ) => {

				mouse.set( e.clientX, e.clientY );

				mouseR.x = ( event.clientX / window.innerWidth ) * 2 - 1;

				mouseR.y = - ( event.clientY / window.innerHeight ) * 2 + 1;

			};

			function initRenderer() {

				if ( renderer ) {

					renderer.setAnimationLoop();
					renderer.dispose();
					renderTarget.dispose();
					composer.dispose();
					renderPass.dispose();
					depthSavePass.dispose();
					outPass.dispose();
					renderTarget.dispose();
					controls.dispose();

					renderer.domElement.removeEventListener( 'mousemove', onMouseMouve, false );

					const canvas = renderer.domElement;

					if ( canvas && canvas.parentNode ) {

						canvas.parentNode.removeChild( canvas );

					}

				}

				const animate = () => {

					controls.update();

					stats.begin();

					if ( settings.animate ) {

						r += 0.01;

						material.displacementScale = 4 + 2 * Math.sin( r );

						const m = 0.1 - Math.cos( r ) * 0.1;

						material.displacementMap.offset.set( m, m );
						material.normalMap.offset.set( m, m );

					}


					render();

					stats.end();

				};

				// console.log('settings.logarithmicDepthBuffer', settings.logarithmicDepthBuffer);
				renderer = new THREE.WebGLRenderer( {
					logarithmicDepthBuffer: settings.logarithmicDepthBuffer == logarithmicDepthBuffer[ 1 ] } );

				controls = new OrbitControls( camera, renderer.domElement );
				controls.enableZoom = false;
				controls.enableDamping = true;

				container.appendChild( renderer.domElement );


				renderer.setPixelRatio( window.devicePixelRatio );
				renderer.setSize( window.innerWidth, window.innerHeight );
				renderer.shadowMap.enabled = true;
				renderer.shadowMap.type = THREE.VSMShadowMap;
				renderer.setAnimationLoop( animate );

				renderTarget = new THREE.WebGLRenderTarget( window.innerWidth, window.innerHeight, { type: THREE.HalfFloatType } );
				renderTarget.depthTexture = new THREE.DepthTexture( window.innerWidth, window.innerHeight );

				composer = new EffectComposer( renderer, renderTarget );
				composer.setPixelRatio( window.devicePixelRatio );

				renderPass = new RenderPass( scene, camera );
				depthSavePass = new DepthSavePass();
				depth2NormalPass = new Depth2NormalPass( undefined, depthSavePass.renderTarget.texture );
				outPass = new OutputPass();

				texturePass = new TexturePass( depth2NormalPass.renderTarget.texture );

				texturePass.enabled = settings.showDepthTexture;

				composer.addPass( renderPass );
				composer.addPass( depthSavePass );
				composer.addPass( depth2NormalPass );
				composer.addPass( outPass );
 				composer.addPass( texturePass );

				renderer.domElement.addEventListener( 'mousemove', onMouseMouve, false );

			}

			function initGui() {

				const gui = new GUI();

				gui.add( settings, 'animate' );

				gui.add( settings, 'showDepthTexture' ).onChange( ( v ) => {

					texturePass.enabled = v;

				} );

				gui.add( settings, 'rayCaster' ).onChange( ( v ) => {

					mesures.length = 0;

				} );

				gui.add( settings, 'depthBuffer', logarithmicDepthBuffer ).onChange( ( v ) => {

					settings.logarithmicDepthBuffer = v;
					initRenderer();

				} );

				gui.add( settings, 'timePicking' ).listen();

			}

			let mesh, foo;

			init();
			initGui();

			const mouse = new THREE.Vector2();


			function init() {

				container = document.createElement( 'div' );
				document.body.appendChild( container );

				camera = new THREE.PerspectiveCamera( 100, window.innerWidth / window.innerHeight, 1, 100000 );
				camera.position.set( - 10, 8, 0 );
				camera.lookAt( 0, 0, 0 );

				scene = new THREE.Scene();

				scene.background = new THREE.Color().setHSL( 0.6, 0, 1 );
				scene.fog = new THREE.Fog( scene.background, 1, 5000 );

				const hemiLight = new THREE.HemisphereLight( 0xffffff, 0xffffff, 2 );
				hemiLight.color.setHSL( 0.6, 1, 0.6 );
				hemiLight.groundColor.setHSL( 0.095, 1, 0.75 );
				hemiLight.position.set( 0, 50, 0 );
				scene.add( hemiLight );

				initRenderer();

				scene.add( camera );
				// lights

				const light = new THREE.DirectionalLight( 0xffffff, 2 );
				light.position.set( 0, 15, 20 );
				light.castShadow = true;
				light.shadow.mapSize.width = 2048;
				light.shadow.mapSize.height = 2048;
				light.shadow.camera.far = 50;
				light.shadow.radius = 4;

				const d = 15;
				light.shadow.camera.left = - d;
				light.shadow.camera.right = d;
				light.shadow.camera.top = d;
				light.shadow.camera.bottom = - d;
				light.shadow.bias = - 0.001;
				scene.add( light );

				// textures

				const textureLoader = new THREE.TextureLoader();
				const normalTexture = textureLoader.load( 'textures/noises/voronoi/normal-256x256.png' );
				const displaceTexture = textureLoader.load( 'textures/noises/voronoi/grayscale-256x256.png' );

				normalTexture.wrapS = THREE.RepeatWrapping;
				normalTexture.wrapT = THREE.RepeatWrapping;

				displaceTexture.wrapS = THREE.RepeatWrapping;
				displaceTexture.wrapT = THREE.RepeatWrapping;

				material = new THREE.MeshStandardMaterial( {

					color: 0xffffff,
					roughness: 0.7,
					metalness: 0.4,
					normalMap: normalTexture,
					normalScale: new THREE.Vector2( 1, - 1 ),
					displacementMap: displaceTexture,
					displacementScale: 4,

				} );

				const plane = new THREE.Mesh( new THREE.PlaneGeometry( 30, 40, 256, 256 ), material );
				plane.rotateX( - Math.PI * 0.5 );
				plane.castShadow = true;
				plane.receiveShadow = true;
				scene.add( plane );

				stats = new Stats();
				container.appendChild( stats.dom );

				const tMat = new THREE.MeshStandardMaterial( { color: 0xffff22, depthWrite: false, transparent: true } );
				sphere = new THREE.Mesh( new THREE.SphereGeometry( 0.3, 32, 32 ), tMat );
				const ring = new THREE.Mesh( new THREE.TorusGeometry( 1.5, 0.3, 32, 32 ), tMat );
				ring.scale.z = 0.1;
				ring.castShadow = true;
				ring.receiveShadow = true;
				sphere.castShadow = true;
				sphere.receiveShadow = true;
				scene.add( sphere );
				sphere.add( ring );

				ring.castShadow = true;
				ring.receiveShadow = true;

				// sphere.renderOrder = 0;

				const geometry = new THREE.IcosahedronGeometry( 0.3, 8 );
				const material_ = new THREE.MeshPhongMaterial( { color: 0xffffff } );

				const amount = 13;
				const count = Math.pow( amount, 3 );

				mesh = new THREE.InstancedMesh( geometry, material_, count );


				let i = 0;
				const offset = ( amount - 1 ) / 2;

				const matrix = new THREE.Matrix4();

				for ( let x = 0; x < amount; x ++ ) {

					for ( let y = 0; y < amount; y ++ ) {

						for ( let z = 0; z < amount; z ++ ) {

							matrix.setPosition( offset - x, offset - y, offset - z );

							mesh.setMatrixAt( i, matrix );

							i ++;

						}

					}

				}

				scene.add( mesh );

				mesh.castShadow = true;
				mesh.receiveShadow = true;

				foo = new THREE.Mesh( new THREE.IcosahedronGeometry( 6.0, 100 ), new THREE.MeshStandardMaterial( { color: 0xffffff } ) );

				foo.castShadow = true;
				foo.receiveShadow = true;

				scene.add( foo );


				//
				window.addEventListener( 'resize', onWindowResize );

			}

			function onWindowResize() {

				const width = window.innerWidth;
				const height = window.innerHeight;

				camera.aspect = width / height;
				camera.updateProjectionMatrix();

				renderer.setSize( width, height );
				composer.setSize( width, height );

			}

			//

			let r = 0;

			const raycaster = new THREE.Raycaster();

			function render() {

				composer.render();

				const startTime = performance.now();


				if ( settings.rayCaster ) {

					raycaster.setFromCamera( mouseR, camera );

					const intersection = raycaster.intersectObject( foo );

					if ( intersection[ 0 ] ) {

						sphere.position.copy( intersection[ 0 ].point );

						mesures.push( performance.now() - startTime );

					}

 				} else {

					pickWorldPosition( mouse, renderer, depthSavePass.renderTarget, camera, sphere.position );


					mesures.push( performance.now() - startTime );

 				}


				const moyenne = mesures.reduce( ( a, b ) => a + b, 0 ) / mesures.length;

 				settings.timePicking = `${moyenne.toFixed( 2 )} ms`;

			}

		</script>

	</body>

</html>
